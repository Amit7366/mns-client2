name: bb666-client

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: https://api.bkb444.site
        NEXT_PUBLIC_SITE_URL: https://bb666.site
    ports:
      # Unique localhost port — must not overlap 3044 (bkb444 client) or 5044 (bkb444 api)
      - "127.0.0.1:3066:3000"
    environment:
      NODE_ENV: production
      API_URL: https://api.bkb444.site
      GAME_LAUNCH_URL: https://apivexo.com/api/game/v2/gamelaunch
      GAME_API_SECRET: 483fb0fd241d4f37feea9dc36a7f00e669941c5837cff2aca072aa909f6be8f8
      GAME_API_PREFIX: CTT2J
      GAME_CALLBACK_URL: https://txserver.site/mycallback.php
      NEXT_PUBLIC_SITE_URL: https://bb666.site
      NEXT_PUBLIC_SOCKET_URL: https://api.bkb444.site
    restart: unless-stopped
